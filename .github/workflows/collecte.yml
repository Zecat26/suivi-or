name: Collecte quotidienne

on:
  schedule:
    # Du lundi au vendredi à 17h00 UTC (18h00 heure de Paris en hiver, 19h00 en été).
    # GitHub peut décaler l'exécution de quelques minutes à une heure selon la charge.
    - cron: "0 17 * * 1-5"
  workflow_dispatch: {}   # bouton "Run workflow" pour lancer une collecte à la main

permissions:
  contents: write

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Europe/Paris
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collecte des cours
        run: python suivi_or.py

      - name: Enregistrer les données dans le dépôt
        if: ${{ !cancelled() }}   # enregistre aussi une collecte partielle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Aucune nouvelle donnée."
          else
            git commit -m "Collecte du $(date +%F)"
            git push
          fi
