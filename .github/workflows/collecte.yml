name: Collecte quotidienne

on:
  schedule:
    # Du lundi au vendredi, heures UTC (Paris = UTC+1 en hiver, UTC+2 en été).
    # GitHub peut retarder ou même sauter une exécution programmée quand ses serveurs sont chargés,
    # surtout à l'heure pile : on évite donc les minutes rondes et on prévoit deux créneaux de secours.
    # Plusieurs collectes le même jour ne créent pas de doublon (le dernier relevé du jour remplace le précédent).
    - cron: "17 17 * * 1-5"   # principal : 18h17 Paris (hiver)
    - cron: "43 19 * * 1-5"   # secours   : 20h43 Paris (hiver)
    - cron: "29 21 * * 1-5"   # secours   : 22h29 Paris (hiver)
  workflow_dispatch: {}   # bouton "Run workflow" pour lancer une collecte à la main

permissions:
  contents: write

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Europe/Paris
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Collecte des cours
        run: python suivi_or.py

      - name: Enregistrer les données dans le dépôt
        if: ${{ !cancelled() }}   # enregistre aussi une collecte partielle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Aucune nouvelle donnée."
          else
            git commit -m "Collecte du $(date +%F)"
            git push
          fi
