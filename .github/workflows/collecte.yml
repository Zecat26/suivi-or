name: Collecte quotidienne

on:
  # La collecte quotidienne tourne désormais sur le VPS (minuteur systemd, lun–ven 18h15 heure de Paris).
  # Ce workflow ne sert plus qu'au lancement manuel de secours (bouton "Run workflow").
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Europe/Paris
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Collecte des cours
        run: python suivi_or.py

      - name: Enregistrer les données dans le dépôt
        if: ${{ !cancelled() }}   # enregistre aussi une collecte partielle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Aucune nouvelle donnée."
          else
            git commit -m "Collecte du $(date +%F)"
            git push
          fi
